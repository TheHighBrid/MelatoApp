name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    name: Validate mobile application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Expo Doctor
        run: pnpm dlx expo-doctor

      - name: Export Android bundle
        run: pnpm exec expo export --platform android --output-dir dist-android-validate

  android-qa:
    name: Compile native Android QA APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile standalone Android QA APK
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: pnpm exec expo run:android --variant release --device generic --no-bundler --output ./melato-android-qa.apk

      - name: Upload Android QA APK
        uses: actions/upload-artifact@v4
        with:
          name: melato-android-qa
          path: melato-android-qa.apk
          if-no-files-found: error
          retention-days: 14
