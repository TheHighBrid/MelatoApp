name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    name: Validate mobile application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Expo Doctor
        run: pnpm dlx expo-doctor

      - name: Export Android bundle
        run: pnpm exec expo export --platform android --output-dir dist-android-validate

  android-qa:
    name: Compile native Android QA APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile standalone Android QA APK
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: pnpm exec expo run:android --variant release --device generic --no-bundler --output ./melato-android-qa.apk

      - name: Upload Android QA APK
        uses: actions/upload-artifact@v4
        with:
          name: melato-android-qa
          path: melato-android-qa.apk
          if-no-files-found: error
          retention-days: 14
